[project]
name = "kotonoha"
version = "0.2.0"
description = "Apple silicon system audio captions with NeMo and PLaMo GGUF"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=17.4,<18",
  "httpx>=0.28,<1",
  "huggingface-hub>=2.4,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.5,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
